# Thresholds for weekly health digest analysis
# These are population-level evidence-based defaults. Personal baselines
# are computed weekly from the data itself; only these invariants are pinned.

training:
  acwr_lower_bound: 0.8       # Acute:Chronic Workload Ratio safe zone
  acwr_upper_bound: 1.3
  weekly_acute_ramp_cap: 1.10 # Next week acute <= current × 1.10 (general routine)
  deload_multiplier: 0.70     # When red flags trigger
  return_from_layoff_acute_to_chronic_threshold: 0.50
  # Return-to-running override (see protocols/return-to-running.md). During an
  # active comeback the chronic-load denominator is artificially depressed by the
  # layoff, so the general ACWR band and ramp cap are too conservative — they make
  # longer single runs and normal weekly progression impossible. These looser
  # values apply ONLY while the return-to-running protocol is active.
  comeback_weekly_acute_ramp_cap: 1.15  # Next week acute <= current × 1.15
  comeback_acwr_upper_bound: 1.50        # Tolerated while chronic base is rebuilding

deviation_thresholds:
  personal_sigma_dive: 1.5    # σ from 90-day baseline that forces deep-dive
  hrv_below_baseline_days: 3  # Consecutive days below hrv_baseline_low
  sleep_low_nights_per_week: 4 # Nights <6h that force deep-dive
  sleep_score_drop_pct: 0.25
  sleep_score_drop_consecutive: 2
  skin_temp_spike_celsius: 0.5
  skin_temp_spike_consecutive: 2
  weight_trend_reversal_window_days: 28

data_quality:
  abort_if_no_data_days: 5    # No core-table data in last N days => pipeline warning
  weight_kg_floor: 70         # Filter non-user readings on withings

# Heat protocol (see protocols/heat.md). Bands apply to the FEELS-LIKE
# (apparent) temperature at the session's actual start hour, after the
# post-heatwave modifier. Personalized conservatively for a ~103 kg,
# deconditioned, poorly-acclimatized athlete — deliberately cooler than
# generic population thresholds. Timing (run at the coolest hour) is the
# first mitigation, before any duration cut.
heat:
  green_max: 21               # <= => normal training
  yellow_max: 26              # caution: coolest window, Z1-Z2, ease pace, hydrate
  orange_max: 30              # high: easy only + ~30-40% shorter, or substitute indoor
  # > orange_max => RED: no outdoor running; indoor/AC or rest
  post_heatwave_window_days: 10     # modifier active for N days after a heatwave
  post_heatwave_shift_celsius: 3    # lower every band boundary by this while active
  heatwave_defining_feels_like: 32  # >=3 consecutive days at/above this = a heatwave
  duration_cut_orange_pct: 0.35     # duration reduction in the Orange band

session_planning:
  min_sessions_per_week: 3
  max_sessions_per_week: 5
  horizon_days: 7

evidence_classes:
  - RCT
  - guideline
  - consensus
  - preliminary

# C4 block #21-40 (rev 2026-07-29) — voir protocols/active_block.md, source aria-routine#431
c4_block:
  session_spike_cap_vs_trailing4_avg_load: 1.3   # toute séance hors SL désignée
  long_run_cap_vs_21d_max_load: 1.3              # barreau de la sortie longue hebdo
  acwr_warn: 1.40                                # => séance suivante -30 %, easy only
  acwr_ceiling: 1.50                             # => jour de repos obligatoire
  blank_week_reentry: "semaine suivante <= volume moyen des 4 semaines pré-trou, pas de SL"
  hr_avg_flat_max_bpm: 145
  hr_avg_hill_max_bpm: 148
  hr_spike_hill_max_bpm: 158
  long_run_weekly_share_max: 0.40
  long_run_increment_km_max: 1.0
  no_racing_before: "2026-10-01"
  pain_rule: ">3/10 en course, altération de foulée, ou aggravation J+1 => séance sautée entièrement, pas raccourcie"

# GLP-1 receptor agonist therapy (see protocols/health-profile.md and
# .claude/skills/research-modules/glp1-endurance.md). Population-level
# invariants for interpreting wearable / nutrition / body-composition data
# while the therapy is active. Set `active: false` when therapy stops (and
# update health-profile.md in the same commit).
glp1:
  active: true
  initiation_date: "2026-08-15"        # best estimate — decision 2026-08-04, wearable signature from mid-Aug; refine when Benjamin confirms the first injection
  injection_weekday: null              # 0=Mon … 6=Sun; null until Benjamin logs it
  rhr_expected_shift_bpm_min: 1        # class effect on resting HR vs pre-treatment baseline (RCT)
  rhr_expected_shift_bpm_max: 5
  rebaseline_after_days_on_stable_dose: 21   # after this many days on a stable dose, the post-initiation window is the RHR/HRV reference
  split_personal_baseline_at_initiation: true # never pool pre- and post-initiation days in the 90-day baseline
  require_second_signal_for_rhr_hrv_flag: true # RHR/HRV drift alone is not a red flag while active
  post_injection_side_effect_window_days: 3  # highest GI / fatigue risk in the days after each injection
  dose_escalation_watch_days: 14            # extra caution window after any dose increase
  weight_loss_rate_expected_pct_per_week_min: 0.5
  weight_loss_rate_expected_pct_per_week_max: 1.0
  weight_loss_rate_flag_pct_per_week: 1.5   # faster than this => lean-mass / energy-availability / gallstone warning
  lean_mass_share_of_loss_flag_pct: 35      # Withings muscle-mass share of a 14d weight change above this => flag
  protein_floor_g_per_kg: 1.6               # per kg current body weight, every day
  protein_target_g_per_kg: 2.0              # target on training days
  energy_availability_floor_kcal_per_kg_ffm: 30  # intake - exercise expenditure, per kg fat-free mass (IOC RED-S)
  intake_gap_treat_as_real_after_days: 2    # >= N consecutive zero-intake days on GLP-1 => treat as possible under-eating, not just a logging gap
  hydration_target_ml_per_kg: 35            # baseline daily fluid, before sweat replacement
  pre_run_meal_gap_hours_min: 3             # delayed gastric emptying: last solid meal before a run
  session_duration_min_requiring_fuel: 75   # fuel in-session beyond this on suppressed intake
  strength_sessions_per_week_min: 1         # lean-mass preservation stimulus in the rolling plan
